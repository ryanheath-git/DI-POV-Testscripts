<!DOCTYPE html>
<html lang="en">
<head>
    <style>

    	.button {
	 	  background-color: #FFFFFF;
		  border: none;
		  color: #000000;
		  text-align: center;
		  display: block;
		  height: 60px;
		  width: 60px;
		}
		.buttonround {border-radius: 50%;}

        html {
            font-family: sans-serif;
        }

        div#drop_zone {
            height: 100px;
            width: 400px;
            border: 1px dotted black;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
            font-family: monospace;
        }
          /* Split the screen in half */
        .split {
          height: 100%;
          width: 50%;
          position: fixed;
          z-index: 1;
          top: 0;
          overflow-x: hidden;
          padding-top: 20px;
        }

        /* Control the left side */
        .left {
          left: 20px;
        }

        /* Control the right side */
        .right {
            right: 0;
        }

        .upload_progress_style {
            display: none;
        }

        .upload_spinner {
              border: 16px solid #f3f3f3;
              border-radius: 50%;
              border-top: 16px solid #3498db;
              width: 40px;
              height: 40px;
              -webkit-animation: spin 2s linear infinite; /* Safari */
              animation: spin 2s linear infinite;
        }

        /* Safari */
        @-webkit-keyframes spin {
            0% { -webkit-transform: rotate(0deg); }
            100% { -webkit-transform: rotate(360deg); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* The Modal (background) */
        .modal {
          display: none; /* Hidden by default */
          position: fixed; /* Stay in place */
          z-index: 1; /* Sit on top */
          left: 0;
          top: 0;
          width: 100%; /* Full width */
          height: 100%; /* Full height */
          overflow: auto; /* Enable scroll if needed */
          background-color: rgb(0,0,0); /* Fallback color */
          background-color: rgba(0,0,0,0.4); /* Black w/ opacity */
        }

        /* Modal Content/Box */
        .modal-content {
            color: black;
            position: relative;
            background-color: #fefefe;
            margin: auto;
            padding: 0;
            border: 1px solid #888;
            width: 50%;
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2),0 6px 20px 0 rgba(0,0,0,0.19);
            animation-name: animatetop;
            animation-duration: 0.4s
        }

        /* Modal Header */
        .modal-header {
          padding: 2px 16px;
          background-color: #880000;
          color: white;
        }

        /* Modal Body */
        .modal-body {padding: 2px 16px;}

        /* Modal Footer */
        .modal-footer {
          padding: 2px 16px;
          background-color: #880000;
          color: white;
        }

        /* Add Animation */
        @keyframes animatetop {
          from {top: -300px; opacity: 0}
          to {top: 0; opacity: 1}
        }

        /* The Close Button */
        .close {
          color: #aaa;
          float: right;
          font-size: 28px;
          font-weight: bold;
        }

        .close:hover,
        .close:focus {
          color: black;
          text-decoration: none;
          cursor: pointer;
        }
        body {
 		 background-color: #E6E6FA;
 		 color: #FFFFFF;
		}
    </style>
    <meta charset="UTF-8">
    <title>Deep Instinct Web App</title>
</head>
<body>
    <!--
    <div>
        <h1>Customer Custom App</h1>
    </div>-->
    <div class="split left">
        <div class="centered">

            <h3>File Upload</h3>
            <div id="drop_zone">
                <div id="upload_progress" class="upload_progress_style">
                    <div class="upload_spinner"></div>
                </div>
                <input type="file" name="file_chooser" id="file_chooser" hidden/>
				<input id="upload_file_button" type="button" class="button buttonround" value="upload" />
                drag 'n drop your file to upload here
            </div>
        </div>
    </div>

    <div class="split right">
        <div class="centered">
            <h3>File list</h3>
            <label id = "files">
            [nothing uploaded]
            </label>
            <!-- The Modal -->
            <div id="myModal" class="modal">
                <div class="modal-content">
                    <div id="modal_header" class="modal-header">
                    <!-- <span class="close">&times;</span> -->
                    </div>
                    <div id="modal_body" class="modal-body">
                    </div>
                    <div id="modal_footer" class="modal-footer">
                    </div>
                </div>
            </div>
        </div>
    </div>

<script>

    window.onload = function() {
        updateFileList();
    };

    //-----------------------------------------------
    // Modal dialog handlers
    var modal = document.getElementById("myModal");
    // Get the <span> element that closes the modal
    //**var span = document.getElementsByClassName("close")[0];
    var modal_header = document.getElementById("modal_header")
    var modal_body = document.getElementById("modal_body");
    var modal_footer = document.getElementById("modal_footer");
    var upload_progress = document.getElementById("upload_progress");

    // When the user clicks on <span> (x), close the modal
    /* **
    span.onclick = function() {
      modal.style.display = "none";
    }
*/
    // When the user clicks anywhere outside of the modal, close it
    window.onclick = function(event) {
      if (event.target == modal) {
        modal.style.display = "none";
      }
    }


    // -----------------------------------------------
    // Script for on page handlers
    document.getElementById('upload_file_button').addEventListener('click', openDialog);
    function openDialog() {
        document.getElementById('file_chooser').click();
    }

    document.getElementById('file_chooser').addEventListener('change', (event) => {
        selectedFile = event.target.files[0];
        uploadFile(selectedFile)
        //document.getElementById('file_name').innerHTML = window.selectedFile.name;
    });

    const dropZone = document.getElementById('drop_zone'); //Getting our drop zone by ID
    if (window.FileList && window.File) {
        dropZone.addEventListener('dragover', event => {
            event.stopPropagation();
            event.preventDefault();
            event.dataTransfer.dropEffect = 'copy'; //Adding a visual hint that the file is being copied to the window
        });
        dropZone.addEventListener('drop', event => {
            event.stopPropagation();
            event.preventDefault();
            const files = event.dataTransfer.files; //Accessing the files that are being dropped to the window
            selectedFile = files[0]; //Getting the file from uploaded files list (only one file in our case)
            uploadFile(selectedFile)
        });
    }

    // -----------------------------------------------
    // Script for AJAX rest calls


    function updateFileList()  {
        var ajax = new XMLHttpRequest();
        ajax.open('GET', '/file_list');
        ajax.send();

        ajax.onreadystatechange = function() {
            if (ajax.readyState == XMLHttpRequest.DONE) {
                json = JSON.parse(ajax.responseText);
                filelist = json['files'];
                if (filelist.length == 0) {
                    document.getElementById('files').innerHTML = "Upload some files!"
                }
                else {
                    output = ""
                    for (i = 0; i < filelist.length; i++) {
                        output += filelist[i] + "<br>"
                    }
                    document.getElementById('files').innerHTML = output;
                }
            }
        }
    }

    function uploadFile(file) {
        upload_progress.style.display = "block";
        var formData = new FormData();
        formData.append('file', file);
        var ajax = new XMLHttpRequest();
        ajax.open('POST', '/upload');
        ajax.send(formData);

        ajax.onreadystatechange = function() {
            if (ajax.readyState == XMLHttpRequest.DONE) {
                json = JSON.parse(ajax.responseText)
                if (json['scan_verdict'] == "malicious") {
                    modal_header.style.backgroundColor = "#9f301e";
                    modal_header.innerHTML = "<h2>Alert!</h2>"
                    body = "<h3>This file has malicious content and could not be uploaded.</h3>";
                    severity = json['scan_response']['severity'];
                    body += "<p>Severity: " + severity + "</p><br>";
                    classification = json['scan_response']['classification'];
                    if (classification) {
                        body += "<p>Classification: " + classification + "</p>";
                    }
                    modal_body.innerHTML = body;
                    modal_footer.style.backgroundColor = "#9f301e";
                    modal.style.display = "block";
                }
                else if (json['scan_verdict'] == "benign") {
                    updateFileList();
                    modal_header.style.backgroundColor = "#559955";
                    modal_header.innerHTML = "<h2>Success</h2>";
                    modal_body.innerHTML = "File " + file.name + " uploaded successfully";
                    modal_footer.style.backgroundColor = "#559955";
                    modal.style.display = "block";
                }
                else if (json['scan_verdict'] == "could_not_scan"){
                    modal_header.style.backgroundColor = "#c97922";
                    modal_header.innerHTML = "<h2>Hmmm, something didn't work...</h2>";
                    response = json['scan_response'];
                    modal_body.innerHTML = "<p>This file could not be scanned and will not be uploaded.";
                    modal_body.innerHTML += "<p>" + response;
                    modal_footer.style.backgroundColor = "#c97922";
                    modal.style.display = "block";
                }

                upload_progress.style.display = "none";
            }
        }
    }

</script>
